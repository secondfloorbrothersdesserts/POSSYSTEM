<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>二佬 Sales</title>
<style>
:root{--bg:#F7EBDD;--card:#fff;--ink:#2b1d17;--mute:#7a665b;--red:#8B2230;--gold:#E0A526;--line:#e8d8c6}
@media (prefers-color-scheme:dark){:root{--bg:#1d1512;--card:#2a201b;--ink:#f4e8dc;--mute:#b9a496;--line:#43342c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:12px}.row>*{flex:1}
.k{font-size:12px;color:var(--mute)}.v{font-size:26px;font-weight:700;color:var(--red)}
@media (prefers-color-scheme:dark){.v{color:var(--gold)}}
.small{font-size:13px;color:var(--mute)}
h2{font-size:15px;margin:0 0 10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
input,button{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button{background:var(--red);color:#fff;border:0;font-weight:600;margin-top:10px}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px}
.bar{flex:1;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;position:relative}
@media (prefers-color-scheme:dark){.bar{background:var(--gold)}}
.lbls{display:flex;gap:4px;margin-top:4px}.lbls span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.err{color:#B3261E;margin-top:8px;font-size:14px}
.ord{padding:8px 0;border-bottom:1px dashed var(--line)}.ord:last-child{border:0}
.ord b{float:right}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--mute);margin-left:6px}
.hide{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.chip{flex:0 0 auto;width:auto;margin:0;padding:8px 14px;border-radius:99px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:14px}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
input[type=date]{min-height:46px;min-width:0;max-width:100%}
.row>*{min-width:0}
</style></head><body><div class="wrap">
<h1>二佬糖水铺 · Sales</h1>
<div class="sub" id="asof">Private. Enter your sheet password.</div>

<div id="gate" class="card">
  <input id="pw" type="password" placeholder="Sheet password" autocomplete="current-password">
  <label class="small" style="display:block;margin-top:8px"><input id="rem" type="checkbox" style="width:auto;margin-right:6px" checked>Remember on this phone</label>
  <button id="go">Show sales</button>
  <div class="err" id="err"></div>
</div>

<div id="main" class="hide">
  <div class="chips" id="chips"></div>
  <div class="card hide" id="custom">
    <div class="row"><div><div class="k">From</div><input id="from" type="date"></div><div><div class="k">To</div><input id="to" type="date"></div></div>
    <button id="apply">Show these dates</button>
  </div>
  <div class="card"><div class="k" id="rlabel"></div><div class="v" id="r1" style="font-size:32px">–</div><div class="small" id="r2"></div></div>
  <div class="card"><h2 id="bt">By day</h2><div class="bars" id="bars"></div><div class="lbls" id="lbls"></div></div>
  <div class="card"><h2>By payment</h2><div id="meth"></div></div>
  <div class="card"><h2>Top sellers</h2><div id="top"></div></div>
  <div class="card"><h2>Orders</h2><div id="recent"></div><button class="ghost hide" id="more">Show more</button></div>
  <button class="ghost" id="refresh">Refresh</button>
  <button class="ghost" id="out" style="margin-top:8px">Lock</button>
</div>
</div>
<script>
const URL_='https://script.google.com/macros/s/AKfycbwukV7w-4ZRKllcVZKXdnACJz7h3-HPp7kXQAXpjLlctKkD4keGC6xgPfTl9-GHZMocpw/exec';
const $=id=>document.getElementById(id);
const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
let pw='',today='',cur={key:'today'},last=null,shown=40;
try{pw=localStorage.getItem('sales.pw')||''}catch(e){}
function rangeFor(key){
  const t=today||iso(new Date());
  if(key==='today')return [t,t,'Today'];
  if(key==='yesterday'){const y=addDays(t,-1);return [y,y,'Yesterday'];}
  if(key==='7')return [addDays(t,-6),t,'Last 7 days'];
  if(key==='month')return [t.slice(0,8)+'01',t,'This month'];
  if(key==='last'){const d=fromIso(t.slice(0,8)+'01');d.setDate(0);const e=iso(d);return [e.slice(0,8)+'01',e,'Last month'];}
  return [$('from').value||t,$('to').value||t,'Custom'];
}
function chips(){
  const items=[['today','Today'],['yesterday','Yesterday'],['7','Last 7 days'],['month','This month'],['last','Last month'],['custom','Pick dates']];
  $('chips').innerHTML=items.map(x=>'<button class="chip'+(cur.key===x[0]?' on':'')+'" data-k="'+x[0]+'">'+x[1]+'</button>').join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    cur.key=b.dataset.k;
    if(cur.key==='custom'){$('custom').classList.remove('hide');if(!$('from').value){$('from').value=rangeFor('month')[0];$('to').value=today}chips();return}
    $('custom').classList.add('hide');chips();load();
  });
}
async function load(){
  $('err').textContent='';
  const r=rangeFor(cur.key);
  try{
    const res=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:pw,kind:'report',from:r[0],to:r[1]})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Wrong password');
    if(!today){today=j.asOf;chips();if(cur.key!=='today'){return load()}}
    today=j.asOf;last={j:j,label:r[2]};shown=40;show();
  }catch(e){
    $('gate').classList.remove('hide');$('main').classList.add('hide');
    $('err').textContent=/Wrong password/.test(e.message)?'Wrong password.':'Could not load: '+e.message;
    if(/Wrong password/.test(e.message)){try{localStorage.removeItem('sales.pw')}catch(x){}}
  }
}
function show(){
  const j=last.j;
  $('gate').classList.add('hide');$('main').classList.remove('hide');
  $('asof').textContent='Updated '+new Date().toLocaleTimeString()+' · excludes voided orders and Grab/Shopee';
  $('rlabel').textContent=last.label+' · '+(j.from===j.to?j.from:j.from+' to '+j.to);
  $('r1').textContent=rm(j.sales);
  $('r2').textContent=j.n+' order'+(j.n==1?'':'s')+' · avg '+rm(j.n?j.sales/j.n:0)+(j.qty?' · '+j.qty+' items':'')+(j.voids?' · '+j.voids+' voided':'');
  const span=Math.round((fromIso(j.to)-fromIso(j.from))/864e5)+1;
  let buckets=[];
  if(span<=45){for(let i=0;i<span;i++){const k=addDays(j.from,i);buckets.push([k.slice(8),(j.days[k]||{sales:0}).sales,k])}$('bt').textContent='By day'}
  else{const m={};Object.keys(j.days).forEach(k=>{const mk=k.slice(0,7);m[mk]=(m[mk]||0)+j.days[k].sales});buckets=Object.keys(m).sort().map(k=>[k.slice(5),m[k],k]);$('bt').textContent='By month'}
  const mx=Math.max(1,...buckets.map(x=>x[1]));
  $('bars').innerHTML=buckets.map(x=>'<div class="bar" title="'+x[2]+' '+rm(x[1])+'" style="height:'+Math.max(2,Math.round(x[1]/mx*118))+'px"></div>').join('');
  $('lbls').innerHTML=buckets.map((x,i)=>'<span>'+(buckets.length>20&&i%2?'':x[0])+'</span>').join('');
  const ms=Object.keys(j.methods);
  $('meth').innerHTML=ms.length?ms.map(m=>'<div class="kv"><span>'+esc(m)+'</span><span>'+rm(j.methods[m])+'</span></div>').join(''):'<div class="small">No sales in this period.</div>';
  $('top').innerHTML=j.items.length?j.items.map((x,i)=>'<div class="kv"><span>'+(i+1)+'. '+esc(x[0])+'</span><span>'+x[1]+'</span></div>').join(''):'<div class="small">Nothing in this period.</div>';
  const list=j.orders.slice(0,shown);
  $('recent').innerHTML=list.length?list.map(o=>'<div class="ord"><b>'+rm(o.total)+'</b>'+esc(o.day.slice(5))+' '+esc(o.time)+'<span class="pill">'+esc(o.method)+'</span><div class="small">'+esc(o.items)+'</div></div>').join(''):'<div class="small">No orders in this period.</div>';
  $('more').classList.toggle('hide',j.orders.length<=shown);
}
$('more').onclick=()=>{shown+=60;show()};
$('apply').onclick=()=>{if($('from').value&&$('to').value)load()};
$('go').onclick=()=>{pw=$('pw').value.trim();if(!pw)return;if($('rem').checked){try{localStorage.setItem('sales.pw',pw)}catch(e){}}chips();load()};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('refresh').onclick=load;
$('out').onclick=()=>{try{localStorage.removeItem('sales.pw')}catch(e){}pw='';$('main').classList.add('hide');$('gate').classList.remove('hide');$('pw').value=''};
chips();
if(pw)load();
setInterval(()=>{if(pw&&!$('main').classList.contains('hide')&&cur.key!=='custom')load()},60000);
</script></body></html>
