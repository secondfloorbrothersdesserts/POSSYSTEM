plugins {
    id 'com.android.application'
}

android {
    namespace 'my.erlao.pos'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'env'
    productFlavors {
        live {
            dimension 'env'
            resValue 'string', 'app_name', '二佬糖水铺 POS'
            buildConfigField 'String', 'START_URL', '"https://secondfloorbrothersdesserts.github.io/POSSYSTEM/"'
        }
        staging {
            dimension 'env'
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'POS TEST'
            buildConfigField 'String', 'START_URL', '"https://secondfloorbrothersdesserts.github.io/POSSYSTEM/test/"'
        }
    }

    defaultConfig {
        applicationId 'my.erlao.pos'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    signingConfigs {
        shop {
            storeFile file('release.keystore')
            storePassword 'erlaopos'
            keyAlias 'erlao'
            keyPassword 'erlaopos'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shop
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shop
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
