plugins {
    id 'com.android.application'
}

android {
    namespace 'my.erlao.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'my.erlao.pos'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        shop {
            storeFile file('release.keystore')
            storePassword 'erlaopos'
            keyAlias 'erlao'
            keyPassword 'erlaopos'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shop
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shop
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
