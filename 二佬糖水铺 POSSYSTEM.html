<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二佬糖水铺 POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍧%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style id="pageStyle"></style>
<style>
:root{
  --bg:#E8EFEB; --surface:#FFFFFF; --ink:#1F2528; --muted:#5D6964; --line:#CFDAD4;
  --jade:#2A7A64; --on-jade:#FFFFFF; --mango:#F2B22E; --on-mango:#1F2528; --danger:#B3261E;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131917; --surface:#1D2521; --ink:#E9F0EC; --muted:#98A5A0; --line:#2E3A35;
    --jade:#4DAF8E; --on-jade:#0D1813; --mango:#F2B22E; --on-mango:#1F2528; --danger:#F2867E;
  }
}
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1D2521; --ink:#E9F0EC; --muted:#98A5A0; --line:#2E3A35;
  --jade:#4DAF8E; --on-jade:#0D1813; --mango:#F2B22E; --on-mango:#1F2528; --danger:#F2867E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;width:100%}
.brand h1{font:700 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live::before{background:var(--jade)}
.sync.err::before{background:var(--danger)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;width:100%}
.tabs button{flex:1;padding:10px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--jade);color:var(--on-jade)}
@media (min-width:860px){
  .brand{width:auto}
  .tabs{width:auto}
  .tabs button{flex:none;min-width:110px}
}
main{flex:1;min-height:0;position:relative}

/* sell */
.sell{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.menu{display:flex;flex-direction:column;min-height:0}
.cats{flex:none;display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 14px 104px;align-content:start}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-height:120px;display:flex;flex-direction:column;gap:2px;transition:transform .08s}
.tile.pic{padding-top:0;overflow:hidden}
.ti{width:calc(100% + 24px);margin:0 -12px 8px;height:72px;object-fit:cover;display:block}
.tile:active:not(:disabled){transform:scale(.97)}
.tile.in{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.tile.off{opacity:.5}
.tn{font:700 20px/1.25 var(--serif)}
.te{font-size:12.5px;color:var(--muted);line-height:1.3}
.tp{margin-top:auto;padding-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.qty{position:absolute;bottom:8px;right:8px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--jade);color:var(--on-jade);font-weight:700;display:grid;place-items:center}
.sold{position:absolute;bottom:10px;right:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);padding:28px 8px;text-align:center}

.cart{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .22s ease;z-index:20}
.sell.open .cart{transform:none}
.scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:15}
.sell.open .scrim{display:block}
.cart-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.cart-head h2{font:700 18px/1.2 var(--serif)}
.link{color:var(--muted);font-weight:600;padding:8px 4px}
.lines{flex:1;min-height:60px;overflow-y:auto;padding:0 16px}
.line{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{display:block;font:600 16px/1.3 var(--serif)}
.line .u{font-size:12.5px;color:var(--muted)}
.line .lt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;border-radius:10px;background:var(--bg);font-size:20px;font-weight:600}
.step span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart .none{color:var(--muted);padding:22px 0;text-align:center}
.sums{flex:none;padding:8px 16px 4px}
.disc{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.disc label{font-weight:600;font-size:14px;margin-right:auto}
.disc select,.disc input{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.disc input{width:84px;text-align:right}
.sr{display:flex;justify-content:space-between;color:var(--muted);padding:2px 0;font-variant-numeric:tabular-nums}
.sr.tot{color:var(--ink);font-weight:700;font-size:18px;padding-top:6px}
.charge{display:block;width:calc(100% - 32px);margin:10px 16px 14px;height:58px;border-radius:14px;background:var(--mango);color:var(--on-mango);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.charge:disabled{opacity:.45}
.cartbar{position:absolute;left:12px;right:12px;bottom:12px;height:58px;padding:0 18px;border-radius:16px;background:var(--mango);color:var(--on-mango);display:flex;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:10}
.sell.open .cartbar{display:none}
@media (min-width:860px){
  .sell{grid-template-columns:minmax(0,1fr) 390px}
  .cart{position:static;transform:none;max-height:none;height:100%;border-radius:0;box-shadow:none;border-left:1px solid var(--line);transition:none}
  .scrim,.sell.open .scrim,.cartbar{display:none}
  .grid{padding-bottom:16px}
  .cart-head .close{display:none}
}

/* pages */
.page{height:100%;overflow-y:auto;padding:14px 14px 40px}
.wrap{max-width:760px;margin:0 auto}
.hero{background:var(--mango);color:var(--on-mango);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .lbl{font-weight:600;font-size:14px}
.hero strong{display:block;font:700 34px/1.15 var(--sans);font-variant-numeric:tabular-nums}
.daybar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.daybar button,.daybar input{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;font-weight:600}
.daybar input{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.card h2{font:700 17px/1.3 var(--serif);margin-bottom:6px}
.card h3{font:600 14px/1.3 var(--sans);color:var(--muted);margin:14px 0 4px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.orow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow .h{font-weight:700}
.orow .s{grid-column:1;color:var(--muted);font-size:14px}
.orow .a{grid-row:1/3;grid-column:2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;align-self:center}
.orow.void .a,.orow.void .s{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--danger);margin-left:6px}
.irow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.irow .in{font:600 16px/1.3 var(--serif)}
.irow small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--muted)}
.irow .ip{font-weight:700;font-variant-numeric:tabular-nums}
.irow .so{font-size:12.5px;color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;margin:12px 0}
.fld input,.fld select{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:400;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--jade)}
.btn{height:46px;padding:0 18px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:110px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:470px;max-height:94%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{font:700 19px/1.2 var(--serif)}
.x{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:18px}
.due{display:flex;flex-direction:column;background:var(--mango);color:var(--on-mango);border-radius:14px;padding:14px 16px;margin:6px 0 14px}
.due span{font-weight:600;font-size:14px}
.due strong{font-size:38px;line-height:1.15;font-variant-numeric:tabular-nums}
.due small{font-size:13px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.quick button{height:42px;padding:0 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.chg{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;font-variant-numeric:tabular-nums}
.chg strong{font-size:26px}
.paper{background:var(--bg);padding:12px;border-radius:12px;overflow:auto;margin-bottom:14px}

.crow{display:grid;grid-template-columns:1fr 92px 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.crow label{font-weight:600}
.crow input{height:44px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 8px;text-align:center;font-size:16px}
.crow .st{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.diff{font-weight:700}
.diff.bad{color:var(--danger)}
.gate{text-align:center;padding:26px 18px;margin-top:0}
.custwrap{min-height:100%;display:flex;justify-content:center;padding:48px 16px;overflow-y:auto}
.custcard{width:100%;max-width:420px;height:fit-content;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.custcard h1{font:700 22px/1.3 var(--serif)}
.gate h2{font:700 20px/1.3 var(--serif);margin:0}

/* receipt */
.receipt{width:var(--rw,48mm);margin:0 auto;padding:3mm;background:#fff;color:#000;font:12px/1.4 var(--sans)}
.receipt h3{margin:0 0 2px;text-align:center;font:700 15px/1.3 var(--serif);color:#000}
.receipt .c{text-align:center}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .r span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.receipt .b{font-weight:700;font-size:14px}
#printArea{display:none}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90%;text-align:center}
#toast[hidden]{display:none}

@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  :root{padding:0!important}
  #app,#modal,#toast{display:none!important}
  #printArea{display:block!important}
  #printArea .receipt{width:100%;margin:0;padding:2mm 3mm}
}
@media (prefers-reduced-motion:reduce){.cart,.tile{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1 id="shop"></h1><span class="sync" id="sync"></span></div>
    <nav class="tabs" aria-label="Sections">
      <button data-act="tab" data-v="sell">Sell</button>
      <button data-act="tab" data-v="orders">Orders</button>
      <button data-act="tab" data-v="till">Till</button>
      <button data-act="tab" data-v="members">Members</button>
      <button data-act="tab" data-v="menu">Menu</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="printArea"></div>
<div id="toast" hidden></div>

let DB=null,DL=null;
const dirty=new Map();let cfgDirty=0;let queue=Promise.resolve();

function loadLocal(){
  try{const c=LS.get('pos.cfg');if(c)S.cfg=normCfg(JSON.parse(c))}catch(e){}
  try{const d=LS.get('pos.docs');if(d)S.docs=JSON.parse(d)||{}}catch(e){}
  try{const d=LS.get('pos.shifts');if(d)S.shifts=JSON.parse(d)||{}}catch(e){}
  try{const d=LS.get('pos.members');if(d)S.members=JSON.parse(d)||{}}catch(e){}
}
function persistLocal(){
  const cutoff=dayKey(new Date(Date.now()-90*864e5));
  Object.keys(S.docs).forEach(k=>{if(S.docs[k].day<cutoff)delete S.docs[k]});
  LS.set('pos.docs',JSON.stringify(S.docs));
  LS.set('pos.shifts',JSON.stringify(S.shifts));
  LS.set('pos.members',JSON.stringify(S.members));
}
function saveCfg(){
  if(!DB){LS.set('pos.cfg',JSON.stringify(S.cfg));return}
  cfgDirty++;
  queue=queue.then(()=>DB.doc('config/menu').set(clone(S.cfg))).catch(fail).finally(()=>{cfgDirty--});
}
function saveDoc(id){
  if(!DB){persistLocal();return}
  dirty.set(id,(dirty.get(id)||0)+1);
  queue=queue.then(()=>DB.doc('sales/'+id).set(clone(S.docs[id]))).catch(fail).finally(()=>{
    const n=(dirty.get(id)||1)-1;if(n>0)dirty.set(id,n);else dirty.delete(id);
  });
}
const sdirty=new Map();

}

function shiftFigures(s){
  const os=Object.values(S.docs).flatMap(d=>d.orders).filter(o=>o.shift===s.id&&!o.void);
  const by={};os.forEach(o=>{by[o.method]=r2((by[o.method]||0)+o.due)});
  const cash=by.cash||0;
  const moves=r2((s.moves||[]).reduce((a,m)=>a+m.amt,0));
  return {os:os,by:by,cash:cash,moves:moves,sales:r2(os.reduce((a,o)=>a+o.due,0)),expected:r2(s.open.total+cash+moves)};
}

function totals(){
  const lines=S.cart.map(l=>{
    const it=item(l.id);if(!it)return null;
    const addP=(l.add||[]).reduce((a,x)=>a+x.p,0)+(l.ta==='take'?(S.cfg.takeFee||0):0);
    const nm=it.n+((l.add&&l.add.length)?' + '+l.add.map(x=>x.n).join(', '):'')+(l.ta==='take'?' (Takeaway +'+Number(S.cfg.takeFee||0).toFixed(2)+')':'');
    return {lid:l.lid,id:it.id,n:nm,e:it.e||'',p:r2(it.p+addP),q:l.q};
  }).filter(Boolean);
  const sub=r2(lines.reduce((a,l)=>a+l.p*l.q,0));
  let disc=0;
  if(S.disc.v>0)disc=r2(S.disc.t==='pct'?sub*Math.min(S.disc.v,100)/100:Math.min(S.disc.v,sub));
  const net=r2(sub-disc);
  const tax=r2(net*(S.cfg.taxPct||0)/100);
  return {lines,sub,disc,tax,total:r2(net+tax),count:lines.reduce((a,l)=>a+l.q,0)};
}
const normPhone=p=>String(p||'').replace(/[^0-9]/g,'');
const findMember=p=>S.members[normPhone(p)]||null;
function awardPoints(phone,total){
  const p=normPhone(phone);if(!p)return;
  const pts=Math.floor(total*(S.cfg.ptsPerRM||0));
  const m=S.members[p]||{phone:p,name:'',points:0,visits:0,spent:0,since:dayKey()};
  S.members[p]={phone:p,name:m.name,points:(m.points||0)+pts,visits:(m.visits||0)+1,spent:r2((m.spent||0)+total),since:m.since};
  saveMember(p);
}
function addLine(id,addons,ta){
  const key=addons.map(a=>a.id).sort().join(',')+'|'+ta;
  const ex=S.cart.find(x=>x.id===id&&(x.add||[]).map(a=>a.id).sort().join(',')+'|'+x.ta===key);
  if(ex)ex.q++;else S.cart.push({lid:uid(),id:id,q:1,add:addons,ta:ta});
  render();
}
function optsToText(ad){return (ad||[]).map(a=>a.n+':'+Number(a.p).toFixed(2)).join(', ')}
function textToOpts(t){
  return String(t||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{
    const i=s.lastIndexOf(':'),n=i>=0?s.slice(0,i).trim():s,p=i>=0?parseFloat(s.slice(i+1)):0;
    return {id:'o'+uid(),n:n,p:isNaN(p)?0:r2(p)};
  });
}
function dueFor(total,method){
  if(method==='cash'&&S.cfg.round5){
    const c=Math.round(total*100),rc=Math.round(c/5)*5;
    return {due:rc/100,rnd:r2((rc-c)/100)};
  }
  return {due:total,rnd:0};
}

function rangeBounds(){
  const r=S.range,today=dayKey();

  return{from:r.from,to:r.to};
}

function receiptHTML(o){
  const R=(a,b,c)=>'<div class="r '+(c||'')+'"><span>'+a+'</span><span>'+b+'</span></div>';
  let h='<div class="receipt" style="--rw:'+(S.cfg.paper==='80'?72:48)+'mm"><h3>'+esc(S.cfg.shop)+'</h3>'+
    '<div class="c">'+esc(o.day)+' '+timeStr(o.t)+'</div><div class="c">Order #'+o.no+(o.note?' - '+esc(o.note):'')+'</div>'+
    (o.void?'<div class="c b">VOID</div>':'')+'<hr>';
  o.lines.forEach(l=>{h+='<div>'+esc(l.n)+'</div>'+R(l.q+' x '+Number(l.p).toFixed(2),(l.p*l.q).toFixed(2))});
  h+='<hr>'+R('Subtotal',o.sub.toFixed(2));
  if(o.disc>0)h+=R('Discount','-'+o.disc.toFixed(2));
  if(o.tax>0)h+=R('Tax '+o.taxPct+'%',o.tax.toFixed(2));
  if(o.rnd)h+=R('Rounding',(o.rnd>0?'+':'')+o.rnd.toFixed(2));
  h+=R('Total (RM)',o.due.toFixed(2),'b')+'<hr>'+R(esc(mLabel(o.method)),o.recv.toFixed(2));
  if(o.method==='cash')h+=R('Change',o.change.toFixed(2));
  return h+'<hr><div class="c">Thank you! 谢谢惠顾</div></div>';
}

function memberHint(phone){
  const t=totals(),earn=Math.floor(t.total*(S.cfg.ptsPerRM||0));
  const m=findMember(phone);
  if(normPhone(phone)&&normPhone(phone).length<7)return '';
  if(m)return '<p class="hint">'+esc(m.name||'Member')+' has '+(m.points||0)+' points. This order adds '+earn+'.</p>';
  if(normPhone(phone))return '<p class="hint">New member — this order starts them with '+earn+' points.</p>';

  if(!S.pay)return;
  const t=totals(),d=dueFor(t.total,S.pay.method);

    const recv=parseFloat(S.pay.recv);
    ok=!isNaN(recv)&&recv>=d.due;
    const c=$('#chg');if(c)c.textContent=ok?rm(recv-d.due):'—';

function updateCount(){
  const M=S.modal;if(!M||M.type!=='count')return;
  const total=countTotal(M.counts);
  DENOMS.forEach(d=>{const k=Math.round(d*100);const el=$('#s'+k);if(el)el.textContent=rm(k/100*(M.counts[k]||0))});
  const t=$('#ctot');if(t)t.textContent=rm(total);
  let ok=total>0;
  if(M.mode==='close'){
    const s=curShift(),exp=s?shiftFigures(s).expected:0,diff=r2(total-exp),el=$('#cdiff');
    if(el){el.textContent=diff===0?'Balanced':(diff>0?'Over ':'Short ')+rm(Math.abs(diff));el.classList.toggle('bad',diff!==0)}
    ok=total>0||exp<=0;
  }
  const b=$('#confirmCount');if(b)b.disabled=!ok;
}
function countConfirm(){
  const M=S.modal,total=countTotal(M.counts),note=($('#cnote')||{value:''}).value.trim();
  const counts={};Object.keys(M.counts).forEach(k=>{if(M.counts[k]>0)counts[k]=M.counts[k]});
  if(M.mode==='open'){
    if(total<=0)return;
    const id=dayKey()+'_'+uid().slice(0,4);
    S.shifts[id]={id:id,day:dayKey(),open:{t:new Date().toISOString(),counts:counts,total:total,note:note},moves:[],close:null};

  }else{
    const s=curShift();if(!s)return;
    const f=shiftFigures(s);
    s.close={t:new Date().toISOString(),counts:counts,total:total,expected:f.expected,diff:r2(total-f.expected),note:note,sales:f.sales,by:f.by,orders:f.os.length};
    saveShift(s.id);
    S.cart=[];S.disc={t:'pct',v:0};S.cartOpen=false;
    openModal({type:'report',shift:s});render();
  }
}

/* ---------- actions ---------- */
function shiftDay(n){
  const d=new Date(S.viewDay+'T12:00:00');d.setDate(d.getDate()+n);
  S.viewDay=dayKey(d);render();
}
function confirmPay(){
  const t=totals(),p=S.pay;if(!t.count)return;
  const sh=curShift();
  if(!sh){toast('Open the till first.');return}
  const d=dueFor(t.total,p.method);
  const recv=p.method==='cash'?(parseFloat(p.recv)||0):d.due;
  if(p.method==='cash'&&recv<d.due)return;
  const day=dayKey();
  const o={id:uid(),day:day,dev:DEV,shift:sh.id,t:new Date().toISOString(),no:ordersOf(day).length+1,
    lines:t.lines.map(l=>({n:l.n,e:l.e,p:l.p,q:l.q})),sub:t.sub,disc:t.disc,tax:t.tax,taxPct:S.cfg.taxPct||0,
    total:t.total,rnd:d.rnd,due:d.due,method:p.method,recv:r2(recv),change:r2(recv-d.due),note:p.note.trim(),
    phone:normPhone(p.phone),void:false};
  const id=day+'_'+DEV;
  const cur=S.docs[id]||{day:day,dev:DEV,orders:[]};
  S.docs[id]={day:cur.day,dev:DEV,orders:cur.orders.concat([o])};
  saveDoc(id);
  if(o.phone)awardPoints(o.phone,t.total);
  S.cart=[];S.disc={t:'pct',v:0};S.cartOpen=false;S.pay=null;
  openModal({type:'receipt',order:o,list:false});
}
function voidOrder(o){
  const id=o.day+'_'+o.dev,doc=S.docs[id];if(!doc)return;
  S.docs[id]={day:doc.day,dev:doc.dev,orders:doc.orders.map(x=>x.id===o.id?Object.assign({},x,{void:true}):x)};
  saveDoc(id);
}
function findOrder(id){for(const d of Object.values(S.docs)){const o=d.orders.find(x=>x.id===id);if(o)return o}return null}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCsv(){
  const all=Object.values(S.docs).flatMap(d=>d.orders).sort((a,b)=>a.t.localeCompare(b.t));
  const rows=[['Date','Time','Order','Items','Subtotal','Discount','Tax','Rounding','Total','Payment','Note','Status']];
  all.forEach(o=>rows.push([o.day,timeStr(o.t),o.no,o.lines.map(l=>l.n+' x'+l.q).join('; '),o.sub,o.disc,o.tax,o.rnd,o.due,mLabel(o.method),o.note,o.void?'Void':'Paid']));
  const csv='\ufeff'+rows.map(r=>r.map(csvEsc).join(',')).join('\n');
  try{await DL.save({filename:'sales-'+dayKey()+'.csv',data:csv})}
  catch(e){if(e&&e.code!=='declined')toast('Could not export the file.')}
}
function saveItem(){
  const M=S.modal,n=$('#ef-n').value.trim(),p=parseFloat($('#ef-p').value);
  if(!n){toast('Enter an item name.');return}
  if(isNaN(p)||p<0){toast('Enter a valid price.');return}
  const it={id:M.item.id||('i'+uid()),n:n,e:$('#ef-e').value.trim(),p:r2(p),c:$('#ef-c').value.trim()||'Other',off:$('#ef-off').checked,addons:M.sel.slice()};
  if(M.isNew)S.cfg.items.push(it);
  else S.cfg.items=S.cfg.items.map(x=>x.id===it.id?it:x);
  saveCfg();
  if(!S.cat)S.cat=it.c;
  closeModal();
}
function act(a,b){
  const id=b.dataset.id,v=b.dataset.v;
  switch(a){
    case 'tab':S.tab=v;render();break;
    case 'cat':S.cat=v;render();{const g=$('.grid');if(g)g.scrollTop=0}break;
    case 'add':openModal({type:'addon',id:id,sel:{},ta:'dine'});break;
    case 'ta':S.modal.ta=v;renderModal();break;
    case 'inc':{const l=S.cart.find(x=>x.lid===id);if(l)l.q++;render();break}
    case 'dec':{const l=S.cart.find(x=>x.lid===id);if(l){l.q--;if(l.q<=0)S.cart=S.cart.filter(x=>x!==l)}if(!S.cart.length)S.cartOpen=false;render();break}
    case 'addon-confirm':{const M=S.modal,chosen=Object.values(M.sel).flat().map(findOpt).filter(Boolean);addLine(M.id,chosen,M.ta);closeModal();break}
    case 'clear':S.cart=[];S.disc={t:'pct',v:0};S.cartOpen=false;render();break;
    case 'cart-toggle':S.cartOpen=!S.cartOpen;render();break;
    case 'charge':if(totals().count){S.pay={method:'cash',recv:'',note:'',phone:''};openModal({type:'pay'})}break;
    case 'method':S.pay.method=v;renderModal();break;
    case 'quick':{const d=dueFor(totals().total,'cash').due;S.pay.recv=v==='exact'?d.toFixed(2):v;const r=$('#recv');if(r)r.value=S.pay.recv;updateChange();break}
    case 'confirm-pay':confirmPay();break;
    case 'close-modal':closeModal();break;
    case 'print':try{window.print()}catch(e){toast('Printing is not available here.')}break;
    case 'open-order':{const o=findOrder(id);if(o)openModal({type:'receipt',order:o,list:true});break}
    case 'void-ask':openModal({type:'void',order:S.modal.order});break;
    case 'back-receipt':openModal({type:'receipt',order:S.modal.order,list:true});break;
    case 'void-do':{const o=S.modal.order;voidOrder(o);closeModal();toast('Order #'+o.no+' voided');break}
    case 'range':S.range.mode=v;if(v==='day')S.viewDay=dayKey();render();break;
    case 'day-prev':shiftDay(-1);break;
    case 'day-next':shiftDay(1);break;
    case 'day-today':S.viewDay=dayKey();render();break;
    case 'export':exportCsv();break;
    case 'open-till':openModal({type:'count',mode:'open',counts:{},note:''});break;
    case 'close-till':openModal({type:'count',mode:'close',counts:{},note:''});break;
    case 'count-confirm':countConfirm();break;
    case 'add-move':openModal({type:'move',kind:'out',a:'',n:''});break;
    case 'mtype':S.modal.a=$('#mv-a').value;S.modal.n=$('#mv-n').value;S.modal.kind=v;renderModal();break;
    case 'save-move':saveMove();break;
    case 'open-report':{const s=S.shifts[id];if(s&&s.close)openModal({type:'report',shift:s});break}
    case 'add-member':openModal({type:'member',isNew:true,member:{phone:normPhone(S.mq),name:'',points:0}});break;
    case 'edit-member':{const m=S.members[id];if(m)openModal({type:'member',isNew:false,member:clone(m)});break}
    case 'save-member':saveMemberForm();break;
    case 'load-real-menu':
      if(!S.loadArm){S.loadArm=true;render()}
      else{S.cfg.items=clone(REAL_ITEMS);S.cfg.groups=[clone(ADDON_GROUP)];S.loadArm=false;saveCfg();render();toast('Menu updated with your real items and photos.')}
      break;
    case 'load-real-menu-noimg':
      if(!S.loadArmN){S.loadArmN=true;render()}
      else{S.cfg.items=clone(REAL_ITEMS).map(i=>{delete i.img;return i});S.cfg.groups=[clone(ADDON_GROUP)];S.loadArmN=false;saveCfg();render();toast('Menu updated — text only, no photos.')}
      break;
    case 'add-reward':openModal({type:'reward',isNew:true,reward:{id:null,n:'',pts:''}});break;
    case 'edit-reward':{const r=S.cfg.rewards.find(x=>x.id===id);if(r)openModal({type:'reward',isNew:false,arm:false,reward:clone(r)});break}
    case 'save-reward':{
      const M=S.modal,n=$('#rw-n').value.trim(),pts=parseInt($('#rw-p').value,10);
      if(!n){toast('Enter what the reward is.');return}
      if(isNaN(pts)||pts<=0){toast('Enter a valid points amount.');return}
      const r={id:M.reward.id||('r'+uid()),n:n,pts:pts};
      if(M.isNew)S.cfg.rewards.push(r);else S.cfg.rewards=S.cfg.rewards.map(x=>x.id===r.id?r:x);
      S.cfg.rewards.sort((a,b)=>a.pts-b.pts);
      saveCfg();closeModal();break;
    }
    case 'del-reward':
      if(!S.modal.arm){S.modal.arm=true;renderModal()}
      else{const did=S.modal.reward.id;S.cfg.rewards=S.cfg.rewards.filter(x=>x.id!==did);saveCfg();closeModal()}
      break;
    case 'add-group':openModal({type:'gaddon',isNew:true,group:{id:null,n:'',type:'multi',opts:[]}});break;
    case 'edit-group':{const g=groupOf(id);if(g)openModal({type:'gaddon',isNew:false,arm:false,group:clone(g)});break}
    case 'gtype':S.modal.group.type=v;renderModal();break;
    case 'save-group':{
      const M=S.modal,n=$('#gg-n').value.trim();
      if(!n){toast('Enter a category name.');return}
      const g={id:M.group.id||('g'+uid()),n:n,type:M.group.type,opts:textToOpts($('#gg-o').value)};
      if(M.isNew)S.cfg.groups.push(g);else S.cfg.groups=S.cfg.groups.map(x=>x.id===g.id?g:x);
      saveCfg();closeModal();break;
    }
    case 'del-group':
      if(!S.modal.arm){S.modal.arm=true;renderModal()}
      else{const did=S.modal.group.id;S.cfg.groups=S.cfg.groups.filter(x=>x.id!==did);S.cfg.items=S.cfg.items.map(i=>i.addons&&i.addons.includes(did)?Object.assign({},i,{addons:i.addons.filter(x=>x!==did)}):i);saveCfg();closeModal()}
      break;
    case 'gopt':{
      const M=S.modal,g=b.dataset.g,o=v;
      if(b.dataset.single){const cur=M.sel[g]||[];M.sel[g]=(cur[0]===o)?[]:[o];renderModal()}
      break;
    }
    case 'add-item':openModal({type:'edit',isNew:true,item:{id:null,n:'',e:'',p:'',c:S.cat||'',off:false},sel:[]});break;
    case 'edit-item':{const it=item(id);if(it)openModal({type:'edit',isNew:false,arm:false,item:clone(it),sel:(it.addons||[]).slice()});break}
    case 'save-item':saveItem();break;
    case 'del-item':
      if(!S.modal.arm){S.modal.arm=true;renderModal()}
      else{const did=S.modal.item.id;S.cfg.items=S.cfg.items.filter(x=>x.id!==did);S.cart=S.cart.filter(x=>x.id!==did);saveCfg();closeModal()}
      break;
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){act(b.dataset.act,b);return}
  if(e.target.id==='modal'&&S.modal&&S.modal.type==='receipt')closeModal();
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='recv'){S.pay.recv=e.target.value;updateChange()}
  else if(id==='note'){S.pay.note=e.target.value}
  else if(id==='mphone'){S.pay.phone=e.target.value;const h=$('#mhint');if(h)h.innerHTML=memberHint(S.pay.phone)}
  else if(e.target.classList.contains('cin')&&S.modal){
    S.modal.counts[e.target.dataset.d]=Math.max(0,parseInt(e.target.value,10)||0);
    updateCount();
  }
  else if(e.target.classList.contains('iaopt')){
    const aid=e.target.dataset.aid;
    if(e.target.checked){if(!S.modal.sel.includes(aid))S.modal.sel.push(aid)}else{S.modal.sel=S.modal.sel.filter(x=>x!==aid)}
  }
  else if(e.target.classList.contains('gopt')){
    const g=e.target.dataset.g,o=e.target.dataset.v,cur=S.modal.sel[g]||[];
    S.modal.sel[g]=e.target.checked?cur.concat([o]):cur.filter(x=>x!==o);
  }
  else if(id==='mSearch'){S.mq=e.target.value;render();const el=$('#mSearch');if(el){el.focus();const v=el.value;el.value='';el.value=v}}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='discT'){S.disc.t=e.target.value;render()}
  else if(id==='discV'){S.disc.v=Math.max(0,parseFloat(e.target.value)||0);render()}
  else if(id==='viewDay'){if(e.target.value){S.viewDay=e.target.value;render()}}
  else if(id==='rangeFrom'){if(e.target.value){S.range.from=e.target.value;render()}}
  else if(id==='rangeTo'){if(e.target.value){S.range.to=e.target.value;render()}}
  else if(id==='cfgShop'){S.cfg.shop=e.target.value.trim()||'POS';saveCfg();paintHead();syncPrint()}
  else if(id==='cfgTax'){S.cfg.taxPct=Math.max(0,parseFloat(e.target.value)||0);saveCfg()}
  else if(id==='cfgPaper'){S.cfg.paper=e.target.value;saveCfg();syncPrint()}
  else if(id==='cfgRound'){S.cfg.round5=e.target.checked;saveCfg()}
  else if(id==='cfgPts'){S.cfg.ptsPerRM=Math.max(0,parseFloat(e.target.value)||0);saveCfg()}
  else if(id==='cfgTake'){S.cfg.takeFee=Math.max(0,parseFloat(e.target.value)||0);saveCfg()}
});

let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},3200);
}

/* ---------- shared sync (only when the runtime provides it) ---------- */
function startDb(db){
  DB=db;S.sync='live';
  db.doc('config/menu').onSnapshot(snap=>{
    if(snap.exists&&cfgDirty===0)S.cfg=normCfg(clone(snap.data()));
    softRender();
  },fail);
  db.collection('sales').orderBy('day','desc').limit(120).onSnapshot(snap=>{
    const m={};
    snap.docs.forEach(d=>{m[d.id]=clone(d.data())});
    dirty.forEach((n,id)=>{if(S.docs[id])m[id]=S.docs[id]});
    S.docs=m;S.sync='live';softRender();
  },fail);
  db.collection('shifts').orderBy('day','desc').limit(60).onSnapshot(snap=>{
    const m={};
    snap.docs.forEach(d=>{m[d.id]=clone(d.data())});
    sdirty.forEach((n,id)=>{if(S.shifts[id])m[id]=S.shifts[id]});
    S.shifts=m;softRender();
  },fail);
  db.collection('members').limit(500).onSnapshot(snap=>{
    const m={};
    snap.docs.forEach(d=>{m[d.id]=clone(d.data())});
    mdirty.forEach((n,id)=>{if(S.members[id])m[id]=S.members[id]});
    S.members=m;softRender();
  },fail);
}

/* ---------- customer-only points view ---------- */
const CUSTOMER_MODE=location.search.indexOf('view=customer')>=0;
const CS={phone:'',sub:null,found:null,searched:false};
function custRender(){
  const cfg=S.cfg,pts=CS.found?(CS.found.points||0):0;
  const rewards=(cfg.rewards||[]).slice().sort((a,b)=>a.pts-b.pts);
  $('#app').innerHTML='<div class="custwrap"><div class="custcard">'+
    '<h1>'+esc(cfg.shop)+'</h1><p class="hint" style="margin:4px 0 16px">Check your membership points</p>'+
    '<label class="fld">Phone number<input id="cphone" inputmode="numeric" autocomplete="off" value="'+esc(CS.phone)+'" placeholder="012-3456789"></label>'+
    '<button class="charge" style="width:100%;margin-top:4px" id="csearch">Check my points</button>'+
    (CS.searched?(CS.found?
      '<div class="due" style="margin-top:16px"><span>'+esc(CS.found.name||'Member')+'</span><strong>'+pts+' pts</strong></div>'+
      '<h3>What you can use your points for</h3>'+(rewards.length?rewards.map(r=>'<div class="kv"><span>'+esc(r.n)+'</span><span>'+(pts>=r.pts?'✓ ready':r.pts+' pts')+'</span></div>').join(''):'<p class="hint">No rewards set up yet — ask at the counter.</p>')
      :'<p class="hint" style="margin-top:14px">No member found with that number. Ask at the counter to join.</p>')
    :'')+'</div></div>';
}
function custSearch(raw){
  const p=normPhone(raw);
  CS.phone=raw;CS.searched=true;CS.found=null;
  if(CS.sub){CS.sub();CS.sub=null}
  if(p&&DB)CS.sub=DB.doc('members/'+p).onSnapshot(s=>{CS.found=(s&&s.exists)?clone(s.data()):null;custRender()},()=>{CS.found=null;custRender()});
  else if(p)CS.found=S.members[p]||null;
  custRender();
}
document.addEventListener('click',e=>{
  if(e.target.id==='csearch'){const el=$('#cphone');if(el)custSearch(el.value)}
});

loadLocal();
if(CUSTOMER_MODE){
  custRender();
  (async function(){
    try{
      if(!window.claude||!window.claude.use)return;
      const db=await window.claude.use('db');
      if(db){DB=db;db.doc('config/menu').onSnapshot(s=>{if(s&&s.exists)S.cfg=normCfg(clone(s.data()));custRender()},()=>{})}
    }catch(e){}
  })();
}else{
  render();
  syncPrint();
  (async function(){
    try{
      if(!window.claude||!window.claude.use)return;
      const res=await Promise.all([window.claude.use('db'),window.claude.use('downloads')]);
      DL=res[1]||null;
      if(res[0])startDb(res[0]);else if(DL)softRender();
    }catch(e){}
  })();
}
})();
</script>
