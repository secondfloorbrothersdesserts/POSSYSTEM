name: Build POS app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Get iMin drawer library
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 -o android/app/libs/IminLibs3.0.jar https://yimin-resources.oss-cn-shanghai.aliyuncs.com/demo/IminLibs3.0.jar || echo "iMin library download failed"
          ls -la android/app/libs
          unzip -l android/app/libs/IminLibs3.0.jar | grep -i "IminSDKManager" || true

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleLiveDebug assembleStagingDebug

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/live/debug/app-live-debug.apk ErLaoPOS.apk
          cp android/app/build/outputs/apk/staging/debug/app-staging-debug.apk ErLaoPOS-TEST.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 二佬糖水铺 POS app (latest)
          body: ErLaoPOS.apk is the shop app. ErLaoPOS-TEST.apk is the separate test app.
          files: |
            ErLaoPOS.apk
            ErLaoPOS-TEST.apk
          make_latest: true
